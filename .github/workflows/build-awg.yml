# geovpn-stage1b-v4: сборка AmneziaWG для N30 Pro (PG33N30P), OpenWrt 25.12.6 mediatek/filogic.
# Файл кладётся в репозиторий как .github/workflows/build-awg.yml. Запуск — вручную (Actions → Run workflow).
# Сторонних actions нет: всё делается командами на раннере; результат публикуется через gh (GITHUB_TOKEN).
# Исходники: модуль и утилиты — официальные репозитории amnezia-vpn, закреплены SHA коммитов;
# описания пакетов OpenWrt (Makefile, netifd-скрипт) — форк Slava-Shchipunov/awg-openwrt, закреплён SHA коммита.
name: build-awg

on:
  workflow_dispatch:

permissions:
  contents: write   # только для создания релиза с результатами

defaults:
  run:
    shell: bash     # GitHub запускает это как «bash --noprofile --norc -eo pipefail»: ошибка в любом звене конвейера — провал шага

env:
  OWRT_VER: "25.12.6"
  TARGET: "mediatek"
  SUBTARGET: "filogic"
  EXPECT_KERNEL: "6.12.112"
  EXPECT_KHASH: "f0a7348f9cb959e1bf4d0447669b031e"   # vermagic-хеш ядра роутера (путь kmods на роутере)
  EXPECT_ARCH: "aarch64_cortex-a53"
  # Открытый ключ usign, которым подписан sha256sums выпуска 25.12.6 (id b5043e70f9a75cde из sha256sums.sig).
  # Источник: официальный репозиторий ключей OpenWrt, github.com/openwrt/keyring, коммит fbae29d730f81c892f52e0ff00fe867444aeeae6,
  # файл usign/b5043e70f9a75cde. SHA-256 встроенного файла ключа:
  USIGN_KEY_ID: "b5043e70f9a75cde"
  USIGN_KEY_SHA256: "d7ac10f9ed1b38033855f3d27c9327d558444fca804c685b17d9dcfb0648228f"
  FORK_REPO: "https://github.com/Slava-Shchipunov/awg-openwrt.git"
  FORK_SHA: "03b62269e2edc168504f057cffaafda11b25ed92"   # 2026-09-22 «feat: add awg v3.1 support (#172)»
  KMOD_REPO: "https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git"
  KMOD_VER: "3.1.20261113.02"                             # = версия модуля на SFR с 25.11 (тег v3.1.20261113-02; дефис заменён точкой — формат версии apk)
  KMOD_SHA: "63ed35de3d3f135b17e8eae0b84949e7700303be"   # тег v3.1.20261113-02
  TOOLS_REPO: "https://github.com/amnezia-vpn/amneziawg-tools.git"
  TOOLS_VER: "3.1.20260812"                               # = версия amneziawg-tools на SFR (последний тег утилит)
  TOOLS_SHA: "ee0f0a9aa34ff0a0da4b3433b9512781cfe02843"  # тег v3.1.20260812

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-cryptography rsync swig unzip zlib1g-dev file wget zstd
          uname -a; lsb_release -a || true; echo "ImageVersion=${ImageVersion:-?}"; gcc --version | head -1

      - name: SDK (подпись usign на sha256sums, имя SDK из sha256sums, проверка SHA-256)
        run: |
          mkdir -p out
          cat > usign.pub <<'EOF'
          untrusted comment: Public usign key for unattended snapshot builds
          RWS1BD5w+adc3j2Hqg9+b66CvLR7NlHbsj7wjNVj0XGt/othDgIAOJS+
          EOF
          sed -i 's/^ *//' usign.pub
          echo "${USIGN_KEY_SHA256}  usign.pub" | sha256sum -c -
          # Проверка подписи usign (Ed25519): формат ключа/подписи, совпадение id, подпись над файлом целиком
          cat > usign_verify.py <<'EOF'
          import base64, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          def b64line(path):
              lines = [l.strip() for l in open(path, encoding='ascii') if l.strip()]
              if len(lines) != 2 or not lines[0].startswith('untrusted comment:'):
                  sys.exit(f'{path}: неверный формат')
              return base64.b64decode(lines[1], validate=True)
          pk = b64line(sys.argv[1]); sg = b64line(sys.argv[2]); msg = open(sys.argv[3], 'rb').read()
          if len(pk) != 42 or pk[:2] != b'Ed': sys.exit('ключ: неверная длина/алгоритм')
          if len(sg) != 74 or sg[:2] != b'Ed': sys.exit('подпись: неверная длина/алгоритм')
          if pk[2:10].hex() != sys.argv[4]: sys.exit(f'id ключа {pk[2:10].hex()} != ожидаемого {sys.argv[4]}')
          if pk[2:10] != sg[2:10]: sys.exit(f'id ключа подписи {sg[2:10].hex()} != id ключа {pk[2:10].hex()}')
          Ed25519PublicKey.from_public_bytes(pk[10:]).verify(sg[10:], msg)
          print(f'usign: подпись верна, ключ {pk[2:10].hex()}')
          EOF
          sed -i 's/^          //' usign_verify.py
          BASE="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${TARGET}/${SUBTARGET}"
          curl -fsS --proto '=https' --tlsv1.2 -o sha256sums "$BASE/sha256sums"
          curl -fsS --proto '=https' --tlsv1.2 -o sha256sums.sig "$BASE/sha256sums.sig"
          if python3 usign_verify.py usign.pub sha256sums.sig sha256sums "$USIGN_KEY_ID"; then
            echo "SIG=sha256sums.sig: usign ${USIGN_KEY_ID} OK" | tee -a "$GITHUB_ENV"
          else
            echo "ПОДПИСЬ sha256sums НЕ ПОДТВЕРЖДЕНА — сборка остановлена"; cat sha256sums.sig; exit 1
          fi
          grep -E ' \*openwrt-sdk-[^ ]+\.Linux-x86_64\.tar\.zst$' sha256sums > sdk.sum
          n=$(wc -l < sdk.sum); [ "$n" -eq 1 ] || { echo "ожидалась ровно одна строка SDK, найдено $n"; cat sdk.sum; exit 1; }
          SDK=$(sed 's/^[0-9a-f]* \*//' sdk.sum); echo "SDK=$SDK" | tee -a "$GITHUB_ENV"
          echo "SDK_SHA256=$(cut -d' ' -f1 sdk.sum)" | tee -a "$GITHUB_ENV"
          curl -fsS --proto '=https' --tlsv1.2 -o "$SDK" "$BASE/$SDK"
          sed 's/ \*/  /' sdk.sum | sha256sum -c -
          mkdir sdk && tar --zstd -xf "$SDK" -C sdk --strip-components=1
          rm -f "$SDK"; ls sdk

      - name: Описания пакетов (форк, закреплённый SHA) и закрепление официальных исходников
        run: |
          git clone --no-checkout "$FORK_REPO" fork
          git -C fork checkout --detach "$FORK_SHA"
          [ "$(git -C fork rev-parse HEAD)" = "$FORK_SHA" ] || { echo "SHA форка не совпал"; exit 1; }
          # Пакеты — прямо в sdk/package/<имя>, цели сборки: package/<имя>/compile
          cp -r fork/kmod-amneziawg fork/amneziawg-tools sdk/package/
          cd sdk/package
          cp kmod-amneziawg/Makefile kmod.orig; cp amneziawg-tools/Makefile tools.orig
          sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${KMOD_VER}/" -e "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${KMOD_SHA}/" kmod-amneziawg/Makefile
          sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${TOOLS_VER}/" -e "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${TOOLS_SHA}/" amneziawg-tools/Makefile
          grep -qFx "PKG_SOURCE_URL:=${KMOD_REPO}" kmod-amneziawg/Makefile || { echo "источник модуля не официальный"; exit 1; }
          grep -qFx "PKG_SOURCE_URL:=${TOOLS_REPO}" amneziawg-tools/Makefile || { echo "источник утилит не официальный"; exit 1; }
          grep -qFx "PKG_SOURCE_VERSION:=${KMOD_SHA}" kmod-amneziawg/Makefile || { echo "SHA модуля не закреплён"; exit 1; }
          grep -qFx "PKG_SOURCE_VERSION:=${TOOLS_SHA}" amneziawg-tools/Makefile || { echo "SHA утилит не закреплён"; exit 1; }
          echo "== изменения Makefile относительно форка:"; diff kmod.orig kmod-amneziawg/Makefile || true; diff tools.orig amneziawg-tools/Makefile || true
          rm kmod.orig tools.orig
          echo "== полный текст описаний пакетов (для аудита журнала):"
          for f in kmod-amneziawg/Makefile amneziawg-tools/Makefile; do echo "----- $f"; cat "$f"; done
          echo "----- файлы пакета утилит:"; find amneziawg-tools -type f | sort
          while IFS= read -r f; do echo "----- $f"; cat "$f"; done < <(find amneziawg-tools/files -type f | sort)

      - name: Сборка
        run: |
          cd sdk
          echo "== feeds.conf.default:"; cat feeds.conf.default | tee ../out/feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          { for d in feeds/*/; do [ -d "$d/.git" ] && echo "$(basename "$d") $(git -C "$d" rev-parse HEAD)"; done; } | tee ../out/feeds-revs.txt
          make defconfig
          make package/kmod-amneziawg/compile V=s -j"$(nproc)"
          make package/amneziawg-tools/compile V=s -j"$(nproc)"

      - name: Проверка результата
        run: |
          cd sdk
          find bin -type f -name '*amneziawg*.apk' -exec cp {} ../out/ \;
          ls -l ../out
          K=$(ls ../out/kmod-amneziawg*.apk); T=$(ls ../out/amneziawg-tools*.apk)
          [ "$(echo "$K" | wc -l)" -eq 1 ] && [ "$(echo "$T" | wc -l)" -eq 1 ] || { echo "ожидалось по одному пакету"; exit 1; }
          APK=./staging_dir/host/bin/apk
          "$APK" adbdump "$K" > ../out/kmod-meta.txt; cat ../out/kmod-meta.txt
          "$APK" adbdump "$T" > ../out/tools-meta.txt; cat ../out/tools-meta.txt
          KRE="${EXPECT_KERNEL//./\\.}"
          # точные строки метаданных (-x): зависимость от ядра, архитектура, версии
          grep -Eqx " *- kernel=${KRE}~${EXPECT_KHASH}-r[0-9]+" ../out/kmod-meta.txt || { echo "kmod: зависимость от ядра не ${EXPECT_KERNEL}~${EXPECT_KHASH}"; exit 1; }
          for m in kmod tools; do
            grep -Eqx " *arch: *${EXPECT_ARCH}" "../out/${m}-meta.txt" || { echo "${m}: архитектура не ${EXPECT_ARCH}"; exit 1; }
          done
          # версия kmod в OpenWrt = <версия ядра>.<PKG_VERSION>-r<N> (пример: 6.12.112.3.1.20261113.02-r1)
          grep -Eqx " *version: *${KRE}\.${KMOD_VER//./\\.}-r[0-9]+" ../out/kmod-meta.txt || { echo "kmod: версия не ${EXPECT_KERNEL}.${KMOD_VER}-rN"; exit 1; }
          grep -Eqx " *version: *${TOOLS_VER//./\\.}-r[0-9]+" ../out/tools-meta.txt || { echo "tools: версия не ${TOOLS_VER}-rN"; exit 1; }
          mkdir x && "$APK" extract --allow-untrusted --destination x "$K"
          KO=$(find x -type f -name 'amneziawg.ko')
          [ "$(printf '%s\n' "$KO" | grep -c .)" -eq 1 ] || { echo "ожидался ровно один amneziawg.ko, найдено: ${KO:-ничего}"; exit 1; }
          case "$KO" in */lib/modules/"${EXPECT_KERNEL}"/amneziawg.ko) ;; *) echo "amneziawg.ko не в lib/modules/${EXPECT_KERNEL}: $KO"; exit 1 ;; esac
          file "$KO" > ../out/ko-file.txt; cat ../out/ko-file.txt; grep -q 'ARM aarch64' ../out/ko-file.txt
          VM=$(strings "$KO" | sed -n 's/^vermagic=//p' | head -1); echo "vermagic=$VM" > ../out/ko-vermagic.txt; cat ../out/ko-vermagic.txt
          case "$VM" in "${EXPECT_KERNEL} "*) ;; *) echo "vermagic не ${EXPECT_KERNEL}"; exit 1 ;; esac
          ( cd "$(dirname "$KO")" && sha256sum amneziawg.ko ) > ../out/ko-sha256.txt; cat ../out/ko-sha256.txt
          KOSUM=$(cut -d' ' -f1 ../out/ko-sha256.txt)
          # хеш файла в метаданных apk (paths → amneziawg.ko → hash) должен совпасть с фактическим;
          # поиск только внутри записи amneziawg.ko: до следующего «name:» или строки без отступа
          awk '/^ *- name: amneziawg\.ko$/{f=1;next} f&&(/^ *(- )?name:/||/^[^ ]/){exit} f&&/^ *hash: /{print $2;exit}' ../out/kmod-meta.txt | grep -qx "$KOSUM" || { echo "SHA-256 amneziawg.ko не совпадает с метаданными пакета"; exit 1; }
          # версии инструментов сборки — для BUILDINFO
          XGCC=$(find staging_dir -path 'staging_dir/toolchain-*/bin/*-openwrt-linux-musl-gcc' \( -type f -o -type l \))
          [ "$(printf '%s\n' "$XGCC" | grep -c .)" -eq 1 ] || { echo "ожидался ровно один кросс-компилятор, найдено: ${XGCC:-ничего}"; exit 1; }
          {
            echo "target gcc: $("$XGCC" --version | head -1)"
            echo "host gcc: $(gcc --version | head -1)"
            echo "make: $(make --version | head -1)"
            echo "openssl: $(openssl version)"
            echo "apk: $("$APK" --version | head -1)"
          } > ../out/tools-versions.txt; cat ../out/tools-versions.txt
          mkdir y && "$APK" extract --allow-untrusted --destination y "$T"
          for f in usr/bin/awg usr/bin/amneziawg_watchdog lib/netifd/proto/amneziawg.sh; do
            [ -f "y/$f" ] || { echo "в пакете утилит нет /$f"; exit 1; }
          done
          ( cd y && find . -type f | sort ) > ../out/tools-files.txt; cat ../out/tools-files.txt
          file y/usr/bin/awg > ../out/awg-file.txt; cat ../out/awg-file.txt; grep -q 'ARM aarch64' ../out/awg-file.txt
          cd ../out
          {
            echo "OpenWrt ${OWRT_VER} ${TARGET}/${SUBTARGET}"
            echo "SDK ${SDK} sha256 ${SDK_SHA256}; ${SIG}"
            echo "feeds:"; cat feeds-revs.txt
            echo "fork ${FORK_REPO} ${FORK_SHA}"
            echo "kmod ${KMOD_REPO} ${KMOD_VER} ${KMOD_SHA}"
            echo "tools ${TOOLS_REPO} ${TOOLS_VER} ${TOOLS_SHA}"
            echo "expected kernel ${EXPECT_KERNEL} hash ${EXPECT_KHASH}, arch ${EXPECT_ARCH}; ko $(cat ko-vermagic.txt)"
            echo "runner image ${ImageVersion:-?}"
            cat tools-versions.txt
            echo "ko sha256 $(cut -d' ' -f1 ko-sha256.txt)"
            echo "run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > BUILDINFO.txt
          sha256sum *.apk > SHA256SUMS
          cat BUILDINFO.txt SHA256SUMS

      - name: Публикация (релиз в этом репозитории)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="awg-${KMOD_VER}-owrt-${OWRT_VER}-run${GITHUB_RUN_ID}"
          cd out
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file BUILDINFO.txt \
            *.apk SHA256SUMS BUILDINFO.txt kmod-meta.txt tools-meta.txt tools-files.txt ko-file.txt ko-vermagic.txt ko-sha256.txt awg-file.txt tools-versions.txt feeds.conf.default feeds-revs.txt
